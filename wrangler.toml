name = "ansam"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# فصل الموقعين عبر النطاقات — نشر واحد مربوط بدومينين:
#   - الموقع الرسمي (صفحة الهبوط)  →  ansamair.sa
#   - المنصة الإدارية              →  app.ansamair.sa
# يوجّه التطبيق تلقائياً حسب النطاق (انظر src/lib/sites.ts).
#
# النطاقات المخصّصة معطّلة مؤقتاً لأن الـ Zone «ansamair.sa» لم يصبح Active بعد
# في الحساب الجديد. فعّل الكتلة أدناه (أزل التعليق) بمجرد أن تصبح حالة النطاق
# Active حتى يُربط الموقعان بالنطاقين تلقائياً عند النشر التالي.
# routes = [
#   { pattern = "ansamair.sa", custom_domain = true },
#   { pattern = "www.ansamair.sa", custom_domain = true },
#   { pattern = "app.ansamair.sa", custom_domain = true },
# ]

# يبني الواجهة تلقائياً قبل النشر
[build]
command = "npm run build"

# الملفات الثابتة (مخرجات Vite) + رجوع SPA
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# قاعدة بيانات D1
[[d1_databases]]
binding = "DB"
database_name = "ansam-db"
database_id = "84f7e193-b009-4b53-ba46-9d92dcf27b28"

[vars]
# غيّرها لقيمة عشوائية طويلة من إعدادات المشروع (Variables and Secrets)
SESSION_SECRET = "change-me-to-a-long-random-secret"
