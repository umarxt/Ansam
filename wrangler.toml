name = "ansam-admin"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# قاعدة بيانات D1
# بعد إنشائها بالأمر:  wrangler d1 create ansam-db
# انسخ database_id هنا
[[d1_databases]]
binding = "DB"
database_name = "ansam-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# سر توقيع الجلسات — غيّره في لوحة Cloudflare (Environment variables) لقيمة قوية
SESSION_SECRET = "change-me-to-a-long-random-secret"
